# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# PHPMD is a spin-off project of PHP Depend and
# aims to be a PHP equivalent of the well known Java tool PMD.
# What PHPMD does is: It takes a given PHP source code base
# and look for several potential problems within that source.
# These problems can be things like:
#   Possible bugs
#   Suboptimal code
#   Overcomplicated expressions
#   Unused parameters, methods, properties
# More details at https://phpmd.org/

名称: PHPMD: PHPMD

on:
  push:
    分支: [ "admin" ]: [ "admin" ]
  pull_request:
    # 下面的分支必须是上面分支的子集# The branches below must be a subset of the branches above
    分支: [ "admin" ]: [ "admin" ]
  schedule:
    - cron: '19 21 * * 2'

permissions:
  内容：阅读: read

jobs:
  PHPMD:
    名称：运行PHPMD扫描: Run PHPMD scanning
    运行于: ubuntu-latest: ubuntu-latest
    permissions:
      内容：阅读 # 以获取代码: read # for checkout to fetch code
      安全事件：写入 # 以通过 github/codeql-action/upload-sarif 上传 SARIF 结果: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@aa1fe473f9c687b6fb896056d771232c0bc41161
        with:
          coverage: none
          tools: phpmd

      - name: Run PHPMD
        run: phpmd . sarif codesize --reportfile phpmd-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: phpmd-results.sarif
          wait-for-processing: true
